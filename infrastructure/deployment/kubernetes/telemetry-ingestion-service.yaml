# Production deployment sketch for one container. Same pattern applies to every domain service. Illustrates ADR 2 (autoscaling) and ADR 3 (redundancy).
apiVersion: apps/v1
kind: Deployment
metadata: { name: telemetry-ingestion-service, namespace: ozagrimate-services }
spec:
  replicas: 3
  selector: { matchLabels: { app: telemetry-ingestion-service } }
  template:
    metadata: { labels: { app: telemetry-ingestion-service } }
    spec:
      topologySpreadConstraints:              # spread instances across availability zones (ADR 3)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: telemetry-ingestion-service } }
      containers:
        - name: telemetry-ingestion-service
          image: ozagrimate/telemetry-ingestion-service:1.0.0
          command: ["uvicorn", "services.telemetry_ingestion_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports: [{ containerPort: 8002 }]
          readinessProbe: { tcpSocket: { port: 8002 }, periodSeconds: 5 }
          livenessProbe:  { tcpSocket: { port: 8002 }, periodSeconds: 10, failureThreshold: 3 }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4318" }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: telemetry-ingestion-service, namespace: ozagrimate-services }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: telemetry-ingestion-service }
  minReplicas: 3
  maxReplicas: 40
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
